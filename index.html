<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokeAssist">
<link rel="manifest" href="manifest.json">
<title>PokeAssist</title>
<style>
:root{--bg:#0b1020;--card:#151d32;--text:#f5f7fb;--muted:#9ca8bd;--accent:#60a5fa;--border:#26324d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
header{padding:calc(16px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,16,32,.96);backdrop-filter:blur(12px);z-index:5}
h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:3px}
main{padding:16px 16px 95px;max-width:720px;margin:auto}.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;background:#0e1628;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px}
button{border:0;border-radius:12px;padding:11px 13px;background:var(--accent);color:#07101f;font-weight:700}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{padding:12px 0;border-bottom:1px solid var(--border)}.item:last-child{border-bottom:0}
.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px;margin-top:5px}
nav{position:fixed;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(11,16,32,.97);border-top:1px solid var(--border);display:flex;justify-content:space-around;z-index:10}
nav button{background:transparent;color:var(--muted);font-size:12px;padding:8px 6px}.active{color:#fff}
.hidden{display:none}.big{font-size:28px;font-weight:800}.small{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>⚡ PokeAssist</h1><div class="sub">Pokémon GO companion tools</div></header>
<main>
<section id="pokedex" class="screen">
<div class="panel"><h2>Pokémon Search</h2><input id="search" placeholder="Search Pokémon or type"></div>
<div class="panel" id="results"></div>
</section>

<section id="shinies" class="screen hidden">
<div class="panel"><h2>✨ Shiny Checklist</h2><div class="small">Tap a Pokémon to mark its shiny as caught. Your checklist stays on this device.</div><div id="shinyList"></div></div>
</section>

<section id="iv" class="screen hidden">
<div class="panel"><h2>📊 IV Calculator</h2>
<label>Attack<input id="atk" type="number" min="0" max="15" value="0"></label>
<label>Defense<input id="def" type="number" min="0" max="15" value="0"></label>
<label>HP<input id="hp" type="number" min="0" max="15" value="0"></label>
<p class="big" id="ivTotal">0 / 45</p><div class="small" id="ivPercent">0%</div>
</div></section>

<section id="raids" class="screen hidden">
<div class="panel"><h2>⚔️ Raid Planner</h2>
<input id="boss" placeholder="Raid boss">
<select id="tier"><option>Tier 1</option><option>Tier 3</option><option>Tier 5</option><option>Mega</option><option>Shadow</option></select>
<textarea id="raidNotes" rows="6" placeholder="Counter notes, group size, time, location..."></textarea>
<button id="saveRaid">Save Raid Note</button>
<div id="raidSaved"></div></div></section>

<section id="notes" class="screen hidden">
<div class="panel"><h2>📝 Notes</h2><textarea id="notes" rows="12" placeholder="Events, routes, locations, goals..."></textarea></div>
</section>
</main>

<nav>
<button data-tab="pokedex" class="active">🔎<br>Search</button>
<button data-tab="shinies">✨<br>Shinies</button>
<button data-tab="iv">📊<br>IV</button>
<button data-tab="raids">⚔️<br>Raids</button>
<button data-tab="notes">📝<br>Notes</button>
</nav>

<script>
const mons=[
[1,"Bulbasaur","Grass / Poison"],[4,"Charmander","Fire"],[7,"Squirtle","Water"],
[25,"Pikachu","Electric"],[133,"Eevee","Normal"],[150,"Mewtwo","Psychic"],[151,"Mew","Psychic"],
[155,"Cyndaquil","Fire"],[175,"Togepi","Fairy"],[248,"Tyranitar","Rock / Dark"],
[252,"Treecko","Grass"],[255,"Torchic","Fire"],[258,"Mudkip","Water"],[359,"Absol","Dark"],
[445,"Garchomp","Dragon / Ground"],[448,"Lucario","Fighting / Steel"],[461,"Weavile","Dark / Ice"],
[635,"Hydreigon","Dark / Dragon"],[658,"Greninja","Water / Dark"],[849,"Toxtricity","Electric / Poison"]
];
const $=id=>document.getElementById(id);
function renderResults(){
 let q=$("search").value.toLowerCase();
 let list=mons.filter(m=>(m[1]+" "+m[2]).toLowerCase().includes(q));
 $("results").innerHTML=list.map(m=>`<div class="item"><b>#${m[0]} ${m[1]}</b><br><span class="badge">${m[2]}</span></div>`).join("")||"<div class='small'>No matches.</div>";
}
function renderShinies(){
 let caught=JSON.parse(localStorage.getItem("shinies")||"[]");
 $("shinyList").innerHTML=mons.map(m=>`<div class="item" data-shiny="${m[0]}"><span>${caught.includes(m[0])?"✅":"⬜"} #${m[0]} ${m[1]}</span><span class="small"> ${caught.includes(m[0])?"Caught":"Not caught"}</span></div>`).join("");
 document.querySelectorAll("[data-shiny]").forEach(e=>e.onclick=()=>{let id=+e.dataset.shiny;let a=JSON.parse(localStorage.getItem("shinies")||"[]");a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem("shinies",JSON.stringify(a));renderShinies()});
}
function calcIV(){let a=Math.max(0,Math.min(15,+$("atk").value||0)),d=Math.max(0,Math.min(15,+$("def").value||0)),h=Math.max(0,Math.min(15,+$("hp").value||0));let t=a+d+h;$("ivTotal").textContent=t+" / 45";$("ivPercent").textContent=Math.round(t/45*100)+"%";}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));$(b.dataset.tab).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");});
$("search").oninput=renderResults;["atk","def","hp"].forEach(x=>$(x).oninput=calcIV);
$("notes").value=localStorage.getItem("notes")||"";$("notes").oninput=()=>localStorage.setItem("notes",$("notes").value);
$("saveRaid").onclick=()=>{let v={boss:$("boss").value,tier:$("tier").value,notes:$("raidNotes").value};localStorage.setItem("raid",JSON.stringify(v));$("raidSaved").innerHTML="<p class='small'>Saved on this device.</p>";};
renderResults();renderShinies();calcIV();
</script>
</body></html>
